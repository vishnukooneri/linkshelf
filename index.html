<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LinkShelf is a hand-picked directory of free, legal resources — courses, books, movies, music, open-source software, games, design assets and tools.">
<title>LinkShelf — Curated Free &amp; Legal Resources Directory</title>
<style>
:root{
  --bg:#0a0d1c;--panel:#10142a;--panel2:#161b36;--overlay:#1c2244;--border:#272f55;
  --text:#eef1ff;--muted:#9aa4c9;--accent:#8b5cf6;--accent2:#22d3ee;--accent3:#f471b5;
  --gold:#fbbf24;--ok:#34d399;--warn:#fbbf24;--danger:#fb7185;--info:#60a5fa;
  --header:rgba(10,13,28,.82);--btn-text:#0a0d1c;--radius:16px;--fscale:1;
  --pad:16px;--gap:14px;
  --accent-soft:rgba(139,92,246,.16);--accent2-soft:rgba(34,211,238,.13);--accent3-soft:rgba(244,113,181,.12);
  --ease:cubic-bezier(.22,.7,.25,1);
  --sans:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:calc(15px*var(--fscale));background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;background:radial-gradient(620px 420px at 12% -5%,var(--accent-soft),transparent 60%),radial-gradient(720px 520px at 96% 12%,var(--accent2-soft),transparent 60%),radial-gradient(820px 620px at 50% 112%,var(--accent3-soft),transparent 62%);animation:drift 26s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.6'/></svg>")}
body.no-grain::after{display:none}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}
body.no-motion{scroll-behavior:auto}
body.no-glow .orb{display:none}
body.no-glow .card:hover,body.no-glow .btn:hover{box-shadow:none}
@keyframes drift{from{transform:translate3d(-1.5%,-1%,0) scale(1)}to{transform:translate3d(1.5%,1.5%,0) scale(1.06)}}
#site-view,#dash-view{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font:inherit;color:inherit}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;outline:none;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:auto}
input[type=color]{padding:4px;height:44px}
input[type=range]{padding:0}
[hidden]{display:none!important}
kbd{font-family:var(--mono);font-size:.65em;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel2);color:var(--muted)}
.grad-text{color:var(--accent)}
@supports(-webkit-background-clip:text){.grad-text{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--btn-text);border:none;border-radius:11px;padding:10px 18px;font-weight:700;font-size:.9em;transition:transform .2s var(--ease),filter .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-soft);text-decoration:none}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:5px 11px;font-size:.78em;border-radius:8px}
.btn .arr{transition:transform .2s var(--ease)}
.btn:hover .arr{transform:translateY(2px)}

/* ---------- public header ---------- */
#scrollProgress{position:fixed;top:0;left:0;height:3px;width:0;z-index:90;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3))}
.topwrap{position:sticky;top:0;z-index:60;background:var(--header);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.announce{display:flex;justify-content:center;gap:8px;padding:6px 16px;font-size:.78em;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,var(--accent-soft),var(--accent2-soft));border-bottom:1px solid var(--border)}
.announce a{color:var(--text)}
.topnav{display:flex;align-items:center;gap:16px;padding:12px 24px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);flex-shrink:0}
.brand:hover{text-decoration:none}
.logo-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);font-weight:900}
.wordmark{font-weight:900;font-size:1.05em;letter-spacing:.02em}
.nav-links{display:flex;gap:4px;margin-left:8px}
.nav-link{padding:6px 12px;border-radius:99px;color:var(--muted);font-size:.85em;font-weight:600}
.nav-link:hover{color:var(--text);background:var(--panel2);text-decoration:none}
.nav-link.active{color:var(--text);background:var(--accent-soft)}
.nav-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.searchbtn{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:7px 14px;color:var(--muted);font-size:.85em;transition:border-color .2s}
.searchbtn:hover{border-color:var(--accent);color:var(--text)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:92px 24px 56px;border-bottom:1px solid var(--border)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
.o1{width:340px;height:340px;background:var(--accent-soft);top:-80px;right:8%;animation:float1 18s ease-in-out infinite alternate}
.o2{width:260px;height:260px;background:var(--accent2-soft);bottom:-100px;left:12%;animation:float2 22s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(-40px,30px) scale(1.15)}}
@keyframes float2{to{transform:translate(50px,-24px) scale(.9)}}
.hero-inner{position:relative;max-width:1260px;margin:0 auto}
.overline{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.7em;letter-spacing:.28em;text-transform:uppercase;color:var(--accent2);margin-bottom:18px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 var(--accent2-soft);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(2.8em,7vw,5.6em);font-weight:900;line-height:.98;letter-spacing:-.025em;max-width:900px}
.sheen{background:linear-gradient(100deg,var(--text) 30%,var(--accent) 47%,var(--accent2) 57%,var(--text) 74%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--text);animation:sheen 9s linear infinite}
@supports not (-webkit-background-clip:text){.sheen{color:var(--text);background:none}}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-130% 0}}
.lede{font-size:1.15em;color:var(--muted);max-width:640px;margin:18px 0 26px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.chip{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:8px 16px}
.chip b{font-family:var(--mono);font-size:1.25em}
.chip span{font-family:var(--mono);font-size:.62em;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rise{animation:rise .7s var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.22s}.d4{animation-delay:.32s}.d5{animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ---------- ticker ---------- */
.ticker{overflow:hidden;border-bottom:1px solid var(--border);background:var(--panel)}
.ticker-track{display:inline-flex;white-space:nowrap;animation:marquee 32s linear infinite;will-change:transform}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{display:inline-block;padding:9px 16px;font-family:var(--mono);font-size:.68em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tk-star{color:var(--gold)!important}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ---------- collection ---------- */
.collection{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:38px;padding:42px 24px 90px;scroll-margin-top:130px}
.index-col{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}
.index-label{font-family:var(--mono);font-size:.62em;letter-spacing:.3em;color:var(--muted);margin-bottom:10px;padding-left:10px;text-transform:uppercase}
.idx-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border-left:2px solid transparent;color:var(--muted);font-size:.88em;transition:background .2s,color .2s,border-color .2s}
.idx-link:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.idx-link.active{background:var(--accent-soft);color:var(--text);border-left-color:var(--accent)}
.idx-num{font-family:var(--mono);font-size:.65em;opacity:.65}
.idx-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx-count{margin-left:auto;font-family:var(--mono);font-size:.65em;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:1px 7px}
.cat-sec{margin-bottom:58px;scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:16px}
.sec-num{font-family:var(--mono);font-size:2.5em;font-weight:700;line-height:1}
.sec-head h2{font-size:1.5em;font-weight:800;letter-spacing:-.01em}
.sec-meta{font-family:var(--mono);font-size:.65em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-count{margin-left:auto;font-family:var(--mono);font-size:.7em;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:3px 11px;color:var(--muted)}
.sec-rule{height:2px;margin:12px 0 18px;background:linear-gradient(90deg,var(--accent),var(--accent2),transparent);border-radius:2px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap)}
.card{position:relative;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 0 1px var(--accent-soft)}
.card-top{display:flex;align-items:center;gap:8px}
.mono-tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:1.1em;flex-shrink:0}
.mono-tile.sm{width:30px;height:30px;font-size:.85em;border-radius:8px}
.star-badge{font-family:var(--mono);font-size:.7em;color:var(--gold);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);border-radius:99px;padding:2px 8px}
.icon-btn{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);opacity:.65;position:relative;z-index:2;transition:opacity .2s,color .2s,border-color .2s}
.card:hover .icon-btn{opacity:1}
.icon-btn:hover{color:var(--accent2);border-color:var(--accent2)}
.card-name{font-weight:700;font-size:1em;color:var(--text)}
.card-name::after{content:'';position:absolute;inset:0;border-radius:var(--radius)}
.card-name:hover{color:var(--accent);text-decoration:none}
.card-desc{font-size:.85em;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.domain{font-family:var(--mono);font-size:.68em;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.visit{font-family:var(--mono);font-size:.7em;color:var(--accent2);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover .visit{opacity:1}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:.6em;color:var(--accent2);background:var(--accent2-soft);border-radius:5px;padding:1px 6px}
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease) var(--d,0s),transform .6s var(--ease) var(--d,0s)}
body.no-motion .reveal{opacity:1;transform:none}
.empty-state{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--muted)}
.empty-state b{display:block;font-size:1.15em;color:var(--text);margin-bottom:6px}

/* ---------- about / faq / footer ---------- */
.page-sec{max-width:1260px;margin:0 auto;padding:20px 24px 70px;scroll-margin-top:130px}
.page-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad)*1.6)}
.page-card h2{font-size:1.6em;font-weight:800;margin-bottom:12px}
.about-body{color:var(--muted);white-space:pre-line;max-width:820px}
.faq-list{display:grid;gap:10px;margin-top:14px}
.faq-item{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.faq-item summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+';color:var(--accent2);font-family:var(--mono)}
.faq-item[open] summary::after{content:'–'}
.faq-item p{color:var(--muted);margin-top:10px;white-space:pre-line}
.site-footer{border-top:1px solid var(--border);padding:56px 24px 40px;text-align:center;overflow:hidden}
.foot-mark{font-size:clamp(2.5em,8vw,6em);font-weight:900;text-transform:uppercase;line-height:1;color:transparent;-webkit-text-stroke:1px var(--border);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-text{color:var(--muted);font-size:.9em;margin:14px 0 6px}
.foot-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.foot-links a{font-family:var(--mono);font-size:.75em;letter-spacing:.1em;text-transform:uppercase}
.foot-meta{font-family:var(--mono);font-size:.65em;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.totop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--header);backdrop-filter:blur(10px);color:var(--text);font-size:1.1em;z-index:65;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s,border-color .2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{border-color:var(--accent);transform:translateY(-2px)}

/* ---------- palette ---------- */
.palette{position:fixed;inset:0;z-index:120}
.pal-scrim{position:absolute;inset:0;background:rgba(4,6,16,.72);backdrop-filter:blur(6px)}
.pal-panel{position:relative;width:min(660px,92vw);margin:10vh auto 0;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:palIn .22s var(--ease)}
@keyframes palIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.pal-inputrow{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.pal-inputrow .mag{color:var(--accent2);font-size:1em}
#palInput{flex:1;background:transparent;border:none;box-shadow:none;font-size:1em;padding:4px}
.pal-results{max-height:46vh;overflow:auto;padding:6px}
.pal-row{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:transparent;border:none;text-align:left;transition:background .15s}
.pal-row.active,.pal-row:hover{background:var(--accent-soft)}
.pal-main{min-width:0}
.pal-name{display:block;font-size:.9em;font-weight:600;color:var(--text)}
.pal-desc{display:block;font-size:.78em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pal-cat{font-family:var(--mono);font-size:.6em;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);background:var(--accent2-soft);border-radius:5px;padding:2px 6px}
.pal-empty{padding:30px;text-align:center;color:var(--muted);font-size:.9em}
.pal-hint{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-family:var(--mono);font-size:.65em;color:var(--muted)}
mark{background:var(--accent2-soft);color:var(--accent2);border-radius:3px;padding:0 2px}
.pub-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:99px;padding:10px 20px;font-size:.88em;font-weight:600;z-index:130;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pub-toast.show{opacity:1}

/* ---------- dashboard ---------- */
.dash-header{position:sticky;top:0;z-index:70;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:var(--header);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.dash-brand{display:flex;gap:12px;align-items:center}
.dash-brand .logo-mark{width:38px;height:38px}
.dash-brand h1{font-size:1.1em;font-weight:900}
.dash-brand p{font-family:var(--mono);font-size:.65em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dash-body{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:8px 16px;font-size:.85em;font-weight:600;transition:all .2s}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--btn-text);border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}
.panel h3{font-size:1em;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 .sub{font-weight:400;color:var(--muted);font-size:.8em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:1.6em}
.stat span{font-family:var(--mono);font-size:.6em;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meter{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s var(--ease)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row input[type=text]{flex:1;min-width:120px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.field label{font-family:var(--mono);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.check-field{display:flex;align-items:center;gap:8px;font-size:.9em;color:var(--text)}
.check-field input{width:auto}
.cat-row{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;transition:border-color .2s,opacity .2s}
.cat-row .icon-in{width:56px;text-align:center}
.cat-row .name-in{flex:1;min-width:140px}
.cat-row .desc-in{flex:2;min-width:180px}
.drag-handle{cursor:grab;color:var(--muted);font-size:1em;padding:2px 6px;user-select:none}
.drag-handle:active{cursor:grabbing}
.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:.88em}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-family:var(--mono);color:var(--muted);font-size:.6em;letter-spacing:.16em;text-transform:uppercase}
.url{font-family:var(--mono);color:var(--muted);font-size:.72em;word-break:break-all;display:block;max-width:320px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.view-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.view-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:.75em}
.view-chip button{background:none;border:none;color:var(--muted);padding:0}
.view-chip button:hover{color:var(--danger)}
.swatches{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--border)}
.hint{font-size:.78em;color:var(--muted);margin-top:10px}
.list-item{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.list-item .row{margin-bottom:8px}
.modal-back{position:fixed;inset:0;background:rgba(4,6,16,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:140}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;width:min(400px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{margin-bottom:12px;font-size:1.1em}
.drawer-back{position:fixed;inset:0;background:rgba(4,6,16,.5);backdrop-filter:blur(3px);z-index:130}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--border);z-index:131;padding:24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:drawerIn .25s var(--ease)}
@keyframes drawerIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{font-size:1.1em;margin-bottom:16px}
.drawer .form-grid{grid-template-columns:1fr}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:var(--panel);border:1px solid var(--accent);color:var(--text);font-weight:600;font-size:.88em;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:150;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;pointer-events:auto}
.toast-act{background:none;border:none;color:var(--accent2);font-weight:800;margin-left:12px;text-decoration:underline}
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

@media(max-width:960px){
  .collection{grid-template-columns:1fr;gap:20px;padding-top:28px}
  .index-col{position:static;display:flex;gap:6px;overflow-x:auto;max-height:none;padding-bottom:6px}
  .index-label{display:none}
  .idx-link{flex:0 0 auto;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .idx-link.active{border-bottom-color:var(--accent)}
  .hero{padding:64px 20px 40px}
  .nav-links{display:none}
  .form-grid{grid-template-columns:1fr}
  .pal-panel{margin:6vh auto 0}
  .searchbtn span{display:none}
  .topnav{padding:10px 16px}
  .page-sec{padding:10px 16px 50px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

  root.innerHTML='<div id="scrollProgress"></div><div class="topwrap">'+announce+'<header class="topnav"><a class="brand" href="#top"><span class="logo-mark">'+esc2(s.logo||'◈')+'</span><span class="wordmark">'+esc2(s.title)+'</span></a><nav class="nav-links">'+navHtml+'</nav><div class="nav-actions">'+searchBtn+adminBtn+'</div></header></div><section class="hero" id="top"><div class="orb o1"></div><div class="orb o2"></div><div class="hero-inner"><div class="overline rise d1"><span class="pulse"></span>'+esc2((s.hero&&s.hero.eyebrow)||'Curated directory')+' · '+total+' resources</div><h1 class="rise d2"><span class="sheen">'+esc2((s.hero&&s.hero.headline)||s.title)+'</span></h1><p class="lede rise d3">'+esc2((s.hero&&s.hero.subtitle)||s.tagline||'')+'</p><div class="cta-row rise d4"><a class="btn" href="'+esc2((s.hero&&s.hero.primaryTarget)||'#collection')+'"'+extAttrs((s.hero&&s.hero.primaryTarget)||'')+'>'+esc2((s.hero&&s.hero.primaryLabel)||'Browse')+' <span class="arr">↓</span></a>'+secondaryBtn+'</div>'+statsHtml+'</div></section>'+(cats.length?'<div class="ticker"><div class="ticker-track">'+tick+tick+'</div></div>':'')+'<div class="collection" id="collection"><aside class="index-col"><div class="index-label">Index</div><nav id="indexNav">'+indexHtml+'</nav></aside><main class="sections" id="sections">'+secsHtml+'</main></div>'+aboutHtml+faqHtml+'<footer class="site-footer"><div class="foot-mark">'+esc2(s.title)+'</div><p class="foot-text">'+esc2(footerObj.text||'')+'</p><div class="foot-links">'+footLinks+'</div><div class="foot-meta">'+cats.length+' categories · '+total+' links · '+stars+' curated picks</div></footer><button class="totop" id="toTop" data-action="top">↑</button><div class="palette" id="palette" hidden><div class="pal-scrim" data-action="close-palette"></div><div class="pal-panel" role="dialog" aria-modal="true" aria-label="Search"><div class="pal-inputrow"><span class="mag">⌕</span><input id="palInput" placeholder="Search '+total+' resources   var $=function(id){return document.getElementById(id);};

  var revealIO=null,spyIO=null,revs=root.querySelectorAll('.reveal');

  var ticking=false;

  window.addEventListener('scroll',onScroll,{passive:true});paintScroll();
  var palOpen=false,palIdx=0,palList=[];
  function renderPal(q){q=(q||'').trim().toLowerCase();palList=[];cats.forEach(function(c){c.links.forEach(function(l){var hay=(l.name+' '+(l.desc||'')+' '+host2(l.url)+' '+c.name+' '+(l.tags||[]).join(' ')).toLowerCase();if(!q||hay.indexOf(q)>-1)palList.push({l:l,c:c});});});palList=palList.slice(0,40);palIdx=0;var box=$('palResults');if(!box)return;if(!palList.length){box.innerHTML='<div class="pal-empty">No matches'+(q?' for “'+esc2(q)+'”':'')+'. Try another word.</div>';return;}box.innerHTML=palList.map(function(it,i){return '<button class="pal-row'+(i===0?' active':'')+'" data-action="visit" data-url="'+esc2(it.l.url)+'">'+tile(it.l.name,true)+'<span class="pal-main"><span class="pal-name">'+hi(it.l.name,q)+'</span><span class="pal-desc">'+hi(it.l.desc||host2(it.l.url),q)+'</span></span><span class="pal-meta"><span class="pal-cat">'+esc2(it.c.name)+'</span><span class="domain">'+esc2(host2(it.l.url))+'</span></span></button>';}).join('');}
  function openPal(){palOpen=true;var p=$('palette');if(p)p.hidden=false;document.body.style.overflow='hidden';var inp=$('palInput');if(inp){inp.value='';renderPal('');setTimeout(function(){inp.focus();},30);}}

  function onKey(e){var tag=(e.target&&e.target.tagName||'').toLowerCase();var typing=tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable);if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){if(!root.hidden){e.preventDefault();if(palOpen)closePal();else openPal();}return;}if(e.key==='Escape'&&palOpen){closePal();return;}if(e.key==='/'&&!typing&&!palOpen&&!root.hidden){e.preventDefault();openPal();}}

  function pt(msg){var n=$('pubToast');if(!n)return;n.textContent=msg;n.classList.add('show');if(ptTimer)clearTimeout(ptTimer);ptTimer=setTimeout(function(){n.classList.remove('show');},2200);}
  function copyLink(u){function done(ok){pt(ok?'Link copied to clipboard':'Copy failed');}function fallback(){try{var ta=document.createElement('textarea');ta.value=u;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);}catch(err){done(false);}}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){done(true);},fallback);}else fallback();}
  function onClick(e){var elx=e.target&&e.target.closest?e.target.closest('[data-action]'):null;if(!elx)return;var act=elx.getAttribute('data-action');if(act==='open-palette'){e.preventDefault();openPal();}else if(act==='close-palette'){e.preventDefault();closePal();}else if(act==='dashboard'){e.preventDefault();if(window.openDashboard)window.openDashboard();}else if(act==='top'){e.preventDefault();try{window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});}catch(err){window.scrollTo(0,0);}}else if(act==='copy'){e.preventDefault();copyLink(elx.getAttribute('data-url'));}else if(act==='visit'){e.preventDefault();var u=elx.getAttribute('data-url');if(u)window.open(u,'_blank','noopener,noreferrer');closePal();}else if(act==='idx'){setActive(elx.getAttribute('data-cat'));}}
